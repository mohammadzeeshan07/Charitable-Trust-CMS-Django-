{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="container">

<h2 class="mb-4">CMS Dashboard</h2>

<div class="row">

<div class="col-md-3">
<div class="card text-center bg-primary text-white mb-3">
<div class="card-body">
<h5>Total Programs</h5>
<h2>{{ program_count }}</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-success text-white mb-3">
<div class="card-body">
<h5>Gallery Images</h5>
<h2>{{ gallery_count }}</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-warning text-dark mb-3">
<div class="card-body">
<h5>Banners</h5>
<h2>{{ banner_count }}</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-danger text-white mb-3">
<div class="card-body">
<h5>Contacts</h5>
<h2>{{ contact_count }}</h2>
</div>
</div>
</div>

</div>

<div class="card mt-4">
<div class="card-body">
<h4>Current Date & Time</h4>
<p>{{ current_time }}</p>
</div>
</div>

</div>

{% endblock %}
